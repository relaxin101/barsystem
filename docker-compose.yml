services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  db-init:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: db-init
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: sh -c "uv run flask db upgrade && uv run flask create-admin"
    environment:
      FLASK_APP: wsgi
      APP_ENV: production
    env_file:
      - .env

  app:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: barsystem
    restart: unless-stopped
    ports:
      - "80:5000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      # Force off in production: flask_apscheduler's start() refuses to start
      # the scheduler when Flask's debug flag (the FLASK_DEBUG env var) is set.
      # This overrides FLASK_DEBUG from .env.
      FLASK_DEBUG: "False"
    env_file:
      - .env

volumes:
  postgres_data:
